name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  verify:
    name: Node 24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup tools
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Verify package and site
        run: ./bin/ghost check

  e2e:
    name: Runtime E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup tools
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Run Node, Vite, Bun, repair, and multi-service E2E
        run: npm run test:e2e
