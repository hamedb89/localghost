name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      ref:
        description: Git tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Existing Git tag to publish, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  publish:
    if: github.repository == 'hamedb89/localghost'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm with trusted publishing support
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${RELEASE_REF}"

      - name: Install dependencies
        run: npm ci

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify package and site
        run: npm run release:check

      - name: Verify runtime E2E
        run: npm run test:e2e

      - name: Publish to npm
        run: npm run publish:public
