name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      ref:
        description: Git tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Existing Git tag to publish, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  publish:
    if: github.repository == 'hamedb89/localghost'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup tools
        uses: jdx/mise-action@v4.2.5
        with:
          cache: true

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${RELEASE_REF}"

      - name: Install dependencies
        run: npm ci

      - name: Verify package and site
        run: ./bin/ghost check

      - name: Verify runtime E2E
        run: npm run test:e2e

      - name: Publish to npm
        run: npm run publish:public
